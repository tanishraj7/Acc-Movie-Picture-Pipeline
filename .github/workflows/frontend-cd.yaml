name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Test Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        id: image
        working-directory: starter/frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${{ secrets.REACT_APP_MOVIE_API_URL }}" \
            -t $IMAGE .

          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Push Docker Image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker push $IMAGE

  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name $EKS_CLUSTER_NAME \
            --region $AWS_REGION

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Deploy to Kubernetes
        working-directory: starter/frontend/k8s
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Deploying image: $IMAGE"

          kustomize build | kubectl apply -f -

          kubectl set image deployment/frontend frontend=$IMAGE

          echo "=== DEPLOYED IMAGE ==="
          kubectl get deployment frontend \
            -o jsonpath="{.spec.template.spec.containers[0].image}"
          echo ""

      - name: Verify Deployment
        run: |
          echo "=== DEPLOYMENT ==="
          kubectl get deployment frontend -o wide

          echo "=== PODS ==="
          kubectl get pods -l app=frontend -o wide

          echo "=== SERVICE ==="
          kubectl get svc frontend -o wide

          echo "=== ENDPOINTS ==="
          kubectl get endpoints frontend -o wide

          echo "=== ENDPOINT SLICES ==="
          kubectl get endpointslices -l kubernetes.io/service-name=frontend -o wide

          echo "=== POD DESCRIPTION ==="
          kubectl describe pod -l app=frontend

          echo "=== IMAGE PULL MESSAGE ==="
          kubectl get pod -l app=frontend \
            -o jsonpath="{.items[0].status.containerStatuses[0].state.waiting.message}" || true
          echo ""

          echo "=== FRONTEND LOGS ==="
          kubectl logs -l app=frontend --tail=100 || true

          echo "=== EVENTS ==="
          kubectl get events \
            --field-selector involvedObject.kind=Pod \
            --sort-by=.lastTimestamp

          echo "=== ROLLOUT STATUS ==="
          kubectl rollout status deployment/frontend --timeout=300s
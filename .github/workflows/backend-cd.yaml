name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/backend/**"

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REPOSITORY: ${{ secrets.ECR_BACKEND_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run lint
        run: pipenv run lint

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Run tests
        run: pipenv run test

  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [lint, test]

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        id: image
        working-directory: starter/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE .
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Push Docker Image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker push $IMAGE

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name $EKS_CLUSTER_NAME \
            --region $AWS_REGION

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Deploy to Kubernetes
        working-directory: starter/backend/k8s
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          echo "Deploying image: $IMAGE"
          kustomize edit set image backend=$IMAGE
          kustomize build | kubectl apply -f -

      - name: Debug Backend Pod
        run: |
          echo "========================================"
          echo "=== DEPLOYMENT STATUS ==="
          echo "========================================"
          kubectl get deployment backend -o wide

          echo "========================================"
          echo "=== POD STATUS ==="
          echo "========================================"
          kubectl get pods -l app=backend -o wide

          echo "========================================"
          echo "=== DEPLOYED IMAGE ==="
          echo "========================================"
          kubectl get deployment backend \
            -o jsonpath="{.spec.template.spec.containers[0].image}"
          echo ""

          echo "========================================"
          echo "=== POD DESCRIPTION ==="
          echo "========================================"
          kubectl describe pods -l app=backend

          echo "========================================"
          echo "=== POD EVENTS ==="
          echo "========================================"
          kubectl get events --sort-by=.lastTimestamp

          echo "========================================"
          echo "=== CONTAINER LOGS ==="
          echo "========================================"
          kubectl logs -l app=backend --tail=100 || true

          echo "========================================"
          echo "=== WAITING CONTAINER MESSAGE ==="
          echo "========================================"
          kubectl get pods -l app=backend \
            -o jsonpath="{.items[0].status.containerStatuses[0].state.waiting.message}" || true
          echo ""

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/backend --timeout=300s